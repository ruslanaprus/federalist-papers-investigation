name: CI and Cloudflare deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Test research and website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install the pinned pnpm release
        run: npm install --global pnpm@10.28.2

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile --offline --ignore-scripts

      - name: Test browser calculations, export, and deployment helpers
        run: pnpm test

      - name: Set up the recorded uv release
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false

      - name: Install the pinned Python environment
        run: uv sync --locked

      - name: Verify research calculations and evidence integrity
        run: uv run --locked python -m src.verification --verify

      - name: Build the static site
        run: pnpm build

  deploy:
    name: Deploy production to Cloudflare Pages
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm this commit is still the main branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo '::error::This run has been superseded. Deploy the current main branch head.'
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm and the locked project
        run: |
          npm install --global pnpm@10.28.2
          pnpm install --frozen-lockfile --offline --ignore-scripts

      - name: Build the tested site
        run: pnpm build

      - name: Create or check the Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node web/deploy/ensure-project.mjs

      - name: Upload production assets
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          packageManager: npm
          command: pages deploy dist --project-name=federalist-papers-investigation --branch=main --commit-hash=${{ github.sha }}

      - name: Check the live deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node web/deploy/check-live.mjs

      - name: Record the deployment links
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: ${{ steps.project.outputs.production_url }}
        run: |
          printf '### Cloudflare Pages\n\nProduction: %s\n\nTested deployment: %s\n' "$PRODUCTION_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
